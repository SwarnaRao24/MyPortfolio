name: Continuous Deployment Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Build & Stream Live to DigitalOcean Droplet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: Deploy Application Layouts via SSH Remote Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Successfully connected to DigitalOcean Droplet."
            
            mkdir -p /app
            cd /app
            
            if [ ! -d "portfolio/.git" ]; then
              echo "Initializing first-time repository clone..."
              git clone https://github.com/SwarnaRao24/MyPortfolio.git portfolio
              cd portfolio
            else
              cd portfolio
              echo "Pulling latest changes from GitHub..."
              git fetch --all
              git reset --hard origin/main
            fi
            
            echo "Gracefully clearing old container builds..."
            docker compose down --remove-orphans || true
            
            echo "Rebuilding Docker asset layers..."
            docker compose up --build -d
            
            echo "Executing operational maintenance schemas..."
            sleep 3
            docker compose exec -T web python manage.py migrate --noinput
            docker compose exec -T web python manage.py collectstatic --noinput
            
            echo "Pipeline delivery cycle complete! Your updates are live."
